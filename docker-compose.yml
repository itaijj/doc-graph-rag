services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docgraph-postgres
    environment:
      POSTGRES_DB: docgraph
      POSTGRES_USER: docgraph
      POSTGRES_PASSWORD: docgraph
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgraph -d docgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: docgraph-neo4j
    environment:
      NEO4J_AUTH: neo4j/graphpassword
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  neo4jdata:
