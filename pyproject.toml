[project]
name = "doc-graph-rag"
version = "0.1.0"
description = "Docling-based multi-database (relational + vector + graph) document ingestion with a LangGraph OpenAI agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "docling>=2.14.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.3.0",
    "openai>=1.60.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "neo4j>=5.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.8.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
